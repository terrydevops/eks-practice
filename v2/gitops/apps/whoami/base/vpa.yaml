###
# VerticalPodAutoscaler for whoami, recommend-only (updateMode: Off). The VPA
# recommender observes actual usage (via metrics-server) and writes sizing advice
# to .status.recommendation. It does NOT change pods (we run recommender-only, no
# updater/admission). Read it with `kubectl describe vpa whoami -n whoami-dev-app`,
# then apply by bumping the Deployment requests in git if you agree.
###
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: whoami
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whoami
  updatePolicy:
    updateMode: "Off" # recommend only — no auto-resize, never fights HPA

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Deployed by the `apps` ApplicationSet into the whoami-dev-app namespace
# (dev and staging share one cluster, isolated by namespace).
namespace: whoami-dev-app
resources:
  - ../../base
  - ingress.yaml
# dev keeps it small; prod overlay would bump replicas / image tag.
replicas:
  - name: whoami
    count: 1

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Flux practice overlay: SAME base the ArgoCD `apps` ApplicationSet uses, but
# delivered by Flux's kustomize-controller into its OWN namespace so the two
# GitOps controllers never fight over the same objects. No ALB Ingress here —
# keep the practice cluster-internal (no real AWS ALB / Route53 records).
namespace: whoami-flux
resources:
  - namespace.yaml
  - ../../../apps/whoami/base
replicas:
  - name: whoami
    count: 1

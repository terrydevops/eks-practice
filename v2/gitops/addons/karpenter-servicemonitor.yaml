###
# ServiceMonitor for Karpenter — owned by us (the chart's own ServiceMonitor is
# gated behind a cluster lookup and gets skipped under ArgoCD's helm template).
# The `release: kube-prometheus-stack` label is required: that Prometheus only
# selects ServiceMonitors carrying it. Scrapes the karpenter service's http-metrics
# (8080) endpoint, so node/pod/provisioning/interruption metrics flow to Prometheus.
###
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: karpenter
  namespace: kube-system
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter
  endpoints:
    - port: http-metrics
      path: /metrics

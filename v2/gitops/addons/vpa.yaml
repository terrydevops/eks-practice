###
# Vertical Pod Autoscaler controller (Fairwinds chart). Installs the VPA CRDs and
# the recommender. We run recommend-only, so the updater and admission-controller
# are disabled (no auto-resizing, no mutating webhook to manage). The recommender
# reads metrics from metrics-server (already installed) and writes sizing advice to
# each VPA object's .status.recommendation. The whoami VPA object comes separately.
###
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://charts.fairwinds.com/stable
    chart: vpa
    targetRevision: 4.12.2
    helm:
      releaseName: vpa
      valuesObject:
        recommender:
          enabled: true
        updater:
          enabled: false
        admissionController:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: vpa
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

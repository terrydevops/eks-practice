###
# The Grafana admin password, sourced from AWS SSM via ESO instead of a manual
# `kubectl create secret`. This closes the only "not in git" gap that would break
# a one-shot rebuild: on a fresh cluster ESO reads the SSM parameter and recreates
# the grafana-admin Secret (keys admin-user / admin-password) that
# kube-prometheus-stack references via grafana.admin.existingSecret.
#
# SkipDryRunOnMissingResource: the ESO CRDs are installed by the external-secrets
# app in the same app-of-apps sync, so on first sync these CRs' CRDs may not exist
# yet -- skip the dry-run so it doesn't deadlock the whole sync.
###
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-southeast-2
      # No auth block: ESO uses the controller pod's EKS Pod Identity credentials
      # (SA external-secrets/external-secrets is associated with the ssm-read role).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: "admin"
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /eks-practice/grafana/admin-password

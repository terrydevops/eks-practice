###
# Slack webhook for Alertmanager, sourced from AWS SSM via ESO — same pattern as
# grafana-external-secret.yaml, so the webhook URL never lands in git and
# re-materializes on every cluster rebuild.
#
# kube-prometheus-stack mounts this Secret into the Alertmanager pod
# (alertmanager.alertmanagerSpec.secrets: [alertmanager-slack]) at
# /etc/alertmanager/secrets/alertmanager-slack/webhook, which the receiver reads
# via `api_url_file` — so the URL stays a file reference, not inline config.
#
# Reuses the aws-ssm ClusterSecretStore defined in grafana-external-secret.yaml.
# Populate once per account:
#   aws ssm put-parameter --type SecureString \
#     --name /eks-practice/alertmanager/slack-webhook \
#     --value 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
###
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
  annotations:
    # ESO CRDs install in the same app-of-apps sync — skip dry-run on missing CRD.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: webhook
      remoteRef:
        key: /eks-practice/alertmanager/slack-webhook

###
# metrics-server — enables `kubectl top` and HPA/VPA metrics. No CRDs.
# A simple Helm addon: proves the addons app-of-apps -> child Application -> Helm flow.
###
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server # no trailing slash: AppProject glob '*' does not match '/'
    chart: metrics-server
    targetRevision: 3.13.1
    helm:
      releaseName: metrics-server
      valuesObject:
        replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]

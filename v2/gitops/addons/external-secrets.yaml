###
# External Secrets Operator (ESO) — syncs secrets from AWS SSM Parameter Store
# into Kubernetes Secrets. This is how secrets stay OUT of git yet re-materialize
# on every cluster rebuild: the source of truth lives in SSM (account-level,
# survives destroy), ESO recreates the k8s Secret from it. First use: the Grafana
# admin password (see grafana-external-secret.yaml).
#
# AWS side: IAM (ssm:GetParameter + kms:Decrypt) + Pod Identity for SA
# external-secrets/external-secrets are in the cluster module. CRDs are large ->
# ServerSideApply + ServerSideDiff (same lesson as Kyverno/Chaos-Mesh).
###
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5" # install before the ExternalSecret/Store CRs
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.7.0
    helm:
      releaseName: external-secrets
      valuesObject:
        fullnameOverride: external-secrets
        installCRDs: true
        serviceAccount:
          create: true
          name: external-secrets
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        webhook:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
        certController:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
